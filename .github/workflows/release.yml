name: Build Release APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Prepare Release signing
        env:
          SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SECRET_KEYSTORE" && -n "$SECRET_STORE_PASSWORD" && -n "$SECRET_ALIAS" && -n "$SECRET_KEY_PASSWORD" ]]; then
            printf '%s' "$SECRET_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SECRET_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [[ -n "$SECRET_KEYSTORE" || -n "$SECRET_STORE_PASSWORD" || -n "$SECRET_ALIAS" || -n "$SECRET_KEY_PASSWORD" ]]; then
            echo "Incomplete signing secrets; configure all four values." >&2
            exit 1
          else
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$RUNNER_TEMP/release.jks" -alias temporary-release \
              -storepass "temporaryRelease2026" -keypass "temporaryRelease2026" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=ThemeUnlock CI, OU=Build, O=Rain"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=temporaryRelease2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=temporary-release" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=temporaryRelease2026" >> "$GITHUB_ENV"
            echo "::warning::Temporary signing key: APKs from separate runs cannot update each other without uninstalling."
          fi
      - name: Assemble Release
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/XiaomiThemeUnlock-release.apk
          sha256sum dist/XiaomiThemeUnlock-release.apk | tee dist/SHA256SUMS.txt
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiThemeUnlock-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
